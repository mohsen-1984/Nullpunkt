name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Generated results (data/generated/) come from the reference gcc, which an author's own machine may not
  # have. On a pull request from this repository, this job records them again with the reference gcc and, if they
  # changed, commits them to the pull request's branch. The other jobs of this run still see the old results, so the
  # run fails once; the commit starts a new run that checks the recorded results (or push again if it does not).
  regen:
    name: Record compiler results (reference gcc)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Record with gcc and XCC, commit if anything changed
        run: |
          gcc --version | head -1
          if node tools/gen-expect.js --check; then echo "up to date"; exit 0; fi
          node tools/gen-expect.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/generated
          git commit -m "Record compiler results with $(gcc -dumpfullversion | sed 's/^/gcc /')"
          git push

  content:
    name: Lessons (checker, generated results, pages)
    # pinned: generated compiler messages depend on the gcc version — gcc 15, the default of Ubuntu 26.04 LTS and so of
    # most learners' WSL and Linux (C.FLG.01); the regen job above records them
    needs: regen
    if: always() && needs.regen.result != 'failure'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generated results are up to date (gcc and XCC)
        run: node tools/gen-expect.js --check
      - name: Checker — zero errors, zero warnings
        run: node tools/check.js
      - name: Version agrees everywhere (site/config.js)
        run: node tools/check-version.js
      - name: Full-text search finds what it should
        run: node tests/search.test.js
      - name: Every lesson in headless Chrome, every language, from file://
        run: node tools/headless-lesson.js
      - name: Site shell — 15 widths × 3 languages × 2 pages, drawer and search
        run: node tools/headless-shell.js

  lab:
    name: Runner lab (Node + Chrome)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Expected outputs match gcc
        run: node tools/build-tests.js --check
      - name: Lab in Node
        run: node tests/run-node.js
      - name: Lab in headless Chrome, from file://
        run: node tools/headless-lab.js
      - name: Interactive input (JSPI) in headless Chrome
        run: INTERACTIVE=1 node tools/headless-lab.js

  vendor:
    name: vendor/wcc is reproducible
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install llvm-ar
        run: sudo apt-get update && sudo apt-get install -y llvm
      - name: Build XCC at the vendored commit, with the patches of vendor/wcc/patches/
        run: |
          commit=$(node -e 'const fs=require("fs");const f=fs.readdirSync("vendor/wcc").find(n=>/^wcc_.*\.js$/.test(n));console.log(require("./vendor/wcc/"+f).commit)')
          git clone https://github.com/tyfkda/xcc /tmp/xcc
          git -C /tmp/xcc checkout "$commit"
          for p in vendor/wcc/patches/*.patch; do [ -e "$p" ] && git -C /tmp/xcc apply "$PWD/$p"; done
          make -C /tmp/xcc wcc
          make -C /tmp/xcc wcc-gen2
      - name: Rebuild the bundle and compare
        run: |
          node tools/build-wcc.js /tmp/xcc
          git diff --exit-code vendor/wcc/
      - name: Rebuild the icons from Lucide and compare
        run: |
          version=$(node -e 'const fs=require("fs");const f=fs.readdirSync("vendor/lucide").find(n=>/^icons_.*\.js$/.test(n));console.log(require("./vendor/lucide/"+f).version)')
          git clone --depth 1 --branch "$version" --filter=blob:none --sparse https://github.com/lucide-icons/lucide /tmp/lucide
          git -C /tmp/lucide sparse-checkout set icons
          node tools/build-icons.js /tmp/lucide "$version"
          git diff --exit-code vendor/lucide/
      - name: Rebuild CodeMirror from the locked packages and compare
        working-directory: tools/codemirror
        run: |
          npm ci --no-audit --no-fund
          npm run build
          git diff --exit-code ../../vendor/codemirror/
