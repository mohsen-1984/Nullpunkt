<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nullpunkt — C from zero</title>
<meta name="description" content="A free, trilingual self-study C course with a C compiler that runs in your browser. In development.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Vazirmatn:wght@400;600&display=swap">
<style>
    :root { --np-bg: #FFFFFF; --np-ink: #1A1B1E; --np-muted: #5C5F66; --np-accent: #3B5BDB; }
    @media (prefers-color-scheme: dark) { :root { --np-bg: #1A1B1E; --np-ink: #E9ECEF; --np-muted: #A6A7AB; --np-accent: #91A7FF; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--np-bg); color: var(--np-ink);
           font: 16px/1.6 Inter, system-ui, sans-serif; }
    main { max-width: 36rem; padding: 2rem; text-align: center; }
    svg { width: 72px; height: 72px; color: var(--np-accent); }
    h1 { font-size: 2rem; font-weight: 600; margin: .5rem 0 0; letter-spacing: -.01em; }
    .tag { color: var(--np-muted); margin: .25rem 0 2rem; }
    .tag span { display: block; }
    .fa { font-family: Vazirmatn, system-ui, sans-serif; direction: rtl; }
    p { margin: 0 0 1rem; }
    a { color: var(--np-accent); }
</style>
</head>
<body>
<main>
    <svg viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="26" fill="none" stroke="currentColor" stroke-width="7"/><circle cx="36" cy="36" r="7" fill="currentColor"/></svg>
    <h1>Nullpunkt</h1>
    <p class="tag">
        <span lang="de">C von Null an</span>
        <span lang="en">C from zero</span>
        <span lang="fa" class="fa">C از صفر</span>
    </p>
    <p lang="en">A free, self-study C course in German, English and Persian, with a C compiler that runs in your browser. <strong>In development</strong> — no lessons yet.</p>
    <p><a href="https://github.com/mohsen-1984/Nullpunkt">github.com/mohsen-1984/Nullpunkt</a></p>
</main>
</body>
</html>
